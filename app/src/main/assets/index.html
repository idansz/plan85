<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>תוכנית 85</title>
<style>html,body{margin:0}img{max-width:100%}</style>
</head>
<body>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one-column phone app. Sticky header, fixed bottom tab bar, content capped at 560px. Palette borrowed from competition plates: blue accent, red protein, yellow carbs, green fat. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E2E7EC; --ink:#131820; --muted:#596473; --line:#D3D9E0;
  --accent:#1F4E9E; --accent-ink:#FFFFFF; --accent-soft:#DCE5F4;
  --prot:#B8352A; --carb:#B07A0C; --fat:#4A7535;
  --good:#2C7748; --warn:#A5660F; --bad:#B0382C;
  --font-display:'Karantina','Assistant',system-ui,sans-serif;
  --font-body:'Assistant','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1116; --surface:#151A21; --sunk:#1B2129; --ink:#E5E9EF; --muted:#96A0AD; --line:#29303A;
    --accent:#88AAEA; --accent-ink:#0D1116; --accent-soft:#1A2538;
    --prot:#EA735F; --carb:#E0AE45; --fat:#8DBA6C;
    --good:#5DBB82; --warn:#E3A54A; --bad:#EE7B6C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1116; --surface:#151A21; --sunk:#1B2129; --ink:#E5E9EF; --muted:#96A0AD; --line:#29303A;
  --accent:#88AAEA; --accent-ink:#0D1116; --accent-soft:#1A2538;
  --prot:#EA735F; --carb:#E0AE45; --fat:#8DBA6C;
  --good:#5DBB82; --warn:#E3A54A; --bad:#EE7B6C;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.muted{color:var(--muted)}
.small{font-size:14px}
.xs{font-size:12.5px}
p{margin:0}
h1,h2,h3{text-wrap:balance}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--font-display);font-weight:700;font-size:36px;line-height:.9;letter-spacing:.5px;white-space:nowrap}
.brand span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex:none}
.iconbtn svg,.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{appearance:none;background:none;border:0;color:var(--muted);font:600 12.5px var(--font-body);padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sections */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-block:26px 10px}
.sec-h h2{font:800 19px/1.2 var(--font-body);margin:0}
.sec-h .act{font:600 14px var(--font-body);color:var(--accent);background:none;border:0;padding:4px 0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.note{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:15px}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.note.good{background:color-mix(in srgb,var(--good) 14%,var(--surface))}

/* hero */
.hero{padding-block:20px 4px;display:grid;gap:14px}
.hero .eyebrow{font-size:14px;color:var(--muted);font-weight:600}
.kcal{display:flex;align-items:baseline;gap:8px}
.kcal b{font-family:var(--font-display);font-weight:700;font-size:84px;line-height:.82;letter-spacing:1px}
.kcal span{font-size:17px;font-weight:700;color:var(--muted)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mac{border-top:4px solid var(--c);padding-top:6px}
.mac .v{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:.9}
.mac .v small{font-family:var(--font-body);font-size:15px;font-weight:700;color:var(--muted);margin-inline-start:2px}
.mac .l{font-size:14px;color:var(--muted);font-weight:600}
.mac.p{--c:var(--prot)} .mac.c{--c:var(--carb)} .mac.f{--c:var(--fat)}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:700}

/* buttons, chips, seg */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 15.5px var(--font-body);padding:10px 16px;border-radius:9px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;font:600 14.5px var(--font-body);min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 14.5px var(--font-body);padding:8px 6px;border-radius:8px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

/* inputs */
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
textarea{font:500 14px var(--font-data);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0;direction:ltr;resize:vertical}
input,select{font:500 16px var(--font-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:46px;width:100%;min-width:0}
input[inputmode]{font-family:var(--font-data);font-variant-numeric:tabular-nums;text-align:center;direction:ltr}
input[type="date"]{direction:ltr;text-align:right}
input::placeholder{color:var(--muted);opacity:.65}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* progress bars */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .t{height:8px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden}
.bar .t i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--c);border-radius:4px}
.bar .t .mk{position:absolute;inset-block:-2px;width:2px;background:var(--ink);opacity:.5}
.bar.p{--c:var(--prot)} .bar.c{--c:var(--carb)} .bar.f{--c:var(--fat)} .bar.k{--c:var(--accent)}

/* program picker */
.progs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prog{appearance:none;text-align:start;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:10px 12px;display:grid;gap:2px;position:relative}
.prog .lv{font-size:12.5px;font-weight:700;color:var(--muted)}
.prog b{font-size:15.5px;line-height:1.25}
.prog i{font-style:normal;font-size:12px;font-weight:700;color:var(--accent)}
.prog[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* exercise */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.ex h3{margin:0;font:800 17px/1.25 var(--font-body)}
.ex .en{font-size:13px;color:var(--muted);direction:ltr;text-align:right}
.ex .meta{font-size:14px;color:var(--muted)}
.ex .meta b{color:var(--ink)}
.sug{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink);width:fit-content}
.sug.up{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.sug.hold{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:8px;align-items:center}
.set .si{color:var(--muted);font-size:14px;text-align:center}
.sets .hd{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600;text-align:center}
.done{appearance:none;width:46px;height:46px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.done svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.done[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--bg)}
.alt{font-size:13px;color:var(--muted)}

/* volume */
details.vol{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.vol summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.vol summary::after{content:"+";color:var(--muted);font-weight:700}
details.vol[open] summary::after{content:"−"}
.vrows{display:grid;gap:7px;padding:0 14px 14px}
.vr{display:grid;grid-template-columns:86px 1fr 36px;gap:8px;align-items:center;font-size:13.5px}
.vr .t{height:10px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.vr .t .band{position:absolute;inset-block:0;background:color-mix(in srgb,var(--good) 22%,transparent)}
.vr .t i{position:absolute;inset-block:2px;inset-inline-start:0;background:var(--ink);border-radius:2px;opacity:.8}

/* meals */
.slot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slot .hd{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 14px;align-items:start}
.slot .lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.slot .nm{appearance:none;border:0;background:none;color:var(--ink);font:800 16.5px/1.3 var(--font-body);padding:0;text-align:start}
.mm{font-size:14px;color:var(--muted)}
.mm .pp{color:var(--prot);font-weight:700}
.scl{display:flex;align-items:center;gap:4px}
.scl button{appearance:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 18px var(--font-body);line-height:1}
.scl span{min-width:42px;text-align:center;font-size:14px}
.slot .tools{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.det{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:10px;background:color-mix(in srgb,var(--sunk) 45%,var(--surface))}
.ing{display:grid;gap:3px;margin:0;padding:0;list-style:none;font-size:15px}
.ing li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-block:3px}
.ing li:last-child{border-bottom:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.opts{gap:6px}
.opt{appearance:none;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:start;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 12px;font:600 15px/1.3 var(--font-body)}
.opt[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .ot{grid-column:1/-1}
.fit{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.fit.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.fit.near{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.fit.off{background:var(--sunk);color:var(--muted)}
.tag{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}

/* shopping */
.aisle h3{font:800 15px var(--font-body);margin:18px 0 6px;color:var(--muted)}
.shop{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.shop label{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:15.5px}
.shop label:last-child{border-bottom:0}
.shop input{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--accent)}
.shop .q{font-size:14px;color:var(--muted);text-align:end}
.shop label:has(input:checked) .n{text-decoration:line-through;color:var(--muted)}

/* tracking */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.stat .l{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1}
.stat .v small{font-family:var(--font-body);font-size:14px;color:var(--muted);font-weight:700}
.stat .s{font-size:13px;color:var(--muted)}
.chart{direction:ltr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px 4px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:4px 8px 6px;direction:rtl}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-inline-end:5px;background:var(--c)}
.legend i.d{background:none;border-top:2px dashed var(--c);height:0}
.wlist{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.wlist .it{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:15px}
.wlist .it:last-child{border-bottom:0}
.x{appearance:none;border:0;background:none;color:var(--muted);font:600 13.5px var(--font-body);padding:6px 4px;min-height:34px}
.x.arm{color:var(--bad)}

/* habits */
.habits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hab{appearance:none;display:flex;gap:10px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:10px 12px;font:600 14.5px/1.25 var(--font-body);min-height:52px}
.hab .bx{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.hab .bx svg{width:16px;height:16px;stroke:var(--bg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.hab[aria-pressed="true"] .bx{background:var(--good);border-color:var(--good)}
.hab[aria-pressed="true"] .bx svg{opacity:1}

/* history */
.hist{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.hist .it{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.hist .it:last-child{border-bottom:0}

/* science */
.sci{display:grid;gap:12px}
.sci article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.sci h3{margin:0;font:800 17px/1.3 var(--font-body)}
.sci .take{font-weight:700;border-inline-start:3px solid var(--accent);padding-inline-start:10px}
.sci p{font-size:15.5px;max-width:65ch}
.src{display:grid;gap:8px;font-size:14px;padding:0;margin:0;list-style:none}
.src a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;word-break:break-word}

/* overlays */
#timer,#toast{position:fixed;left:50%;transform:translateX(-50%);z-index:8;bottom:calc(68px + env(safe-area-inset-bottom,0px));border-radius:999px;font-weight:700;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px)}
#timer{background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px}
#timer .num{font-size:20px}
#timer button{appearance:none;border:0;background:var(--bg);color:var(--ink);border-radius:999px;font:700 13.5px var(--font-body);padding:6px 12px}
#toast{background:var(--accent);color:var(--accent-ink);padding:10px 18px;font-size:15px;bottom:calc(124px + env(safe-area-inset-bottom,0px))}
#sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(30px + env(safe-area-inset-bottom,0px))}
#sheet .in{max-width:560px;margin:0 auto;display:grid;gap:14px}
#sheet h2{font:800 22px var(--font-body);margin:0}

@media (max-width:380px){.kcal b{font-size:72px}.mac .v{font-size:34px}.progs{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app" dir="rtl" lang="he">
  <header class="top">
    <div class="brand"><b>תוכנית 85</b><span id="today-lbl"></span></div>
    <button class="iconbtn" data-act="open-sheet" aria-label="פרופיל והגדרות"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </header>
  <main id="view"></main>
  <nav class="tabs" aria-label="ניווט">
    <div class="in">
      <button data-tab="today"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>היום</button>
      <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>אימון</button>
      <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M9 7.5c0-1.6 1.2-2 1.2-3.5M13.5 7.5c0-1.6 1.2-2 1.2-3.5"/></svg>תזונה</button>
      <button data-tab="track"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 7-7"/></svg>מעקב</button>
      <button data-tab="sci"><svg viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5Z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/><path d="M9 7h6M9 10.5h6"/></svg>מחקר</button>
    </div>
  </nav>
  <div id="timer" hidden></div>
  <div id="toast" hidden role="status"></div>
  <section id="sheet" hidden></section>
</div>

<script>
(function(){
'use strict';
document.documentElement.lang = 'he';

/* ================= DATA ================= */
/* Foods: values per 100 g (or per unit when u is set). Rounded from Israeli labels and USDA. */
const FOODS = {

/* ================= CALCULATIONS ================= */
const sortedW = () => state.weights.slice().sort((a,b)=>a.d<b.d?-1:1);
function trend(){
  const ws = sortedW(); if(!ws.length) return null;
  const last = dnum(ws[ws.length-1].d);
  const win = (a,b)=>ws.filter(x=>{const t=dnum(x.d); return t>a && t<=b;});
  const avg = arr => arr.reduce((s,x)=>s+(+x.w),0)/arr.length;
  const cur = win(last-7,last), prev = win(last-14,last-7);
  const out = {n:ws.length, last:ws[ws.length-1], cur:avg(cur), curN:cur.length, prev:prev.length?avg(prev):null, prevN:prev.length, span:last-dnum(ws[0].d), first:ws[0]};
  out.rate = (out.prev!=null && cur.length>=3 && prev.length>=3) ? (out.prev-out.cur)/out.prev*100 : null;
  out.change = out.prev!=null ? out.cur-out.prev : null;
  return out;
}
function curWeight(){ const t=trend(); return t ? t.cur : +state.profile.weight; }
function targets(){
  const p = state.profile, W = curWeight();
  const bmr = 10*W + 6.25*p.height - 5*p.age + 5;
  const tdee = bmr*p.activity;
  const def = W*p.rate/100*7700/7;
  let kcal = Math.round((tdee - def + (+p.kcalAdj||0))/10)*10;
  const floor = Math.round(bmr/10)*10; let floored=false;
  if(kcal<floor){ kcal=floor; floored=true; }
  const prot = r5(p.prot*W);
  const fat = r5(Math.max(0.8*W, 0.25*kcal/9));
  const carb = Math.max(0, r5((kcal-prot*4-fat*9)/4));
  const weeks = W>p.goal ? Math.ceil(Math.log(p.goal/W)/Math.log(1-p.rate/100)) : 0;
  return {W,bmr:Math.round(bmr),tdee:Math.round(tdee),def:Math.round(def),kcal,p:prot,f:fat,c:carb,weeks,floored};
}
function mealMacros(m,x=1){
  const t={k:0,p:0,f:0,c:0};
  m.ing.forEach(([id,q])=>{ const F=FOODS[id]; const fac = F.u ? q : q/100; t.k+=F.k*fac*x; t.p+=F.p*fac*x; t.f+=F.f*fac*x; t.c+=F.c*fac*x; });
  return t;
}
function planTotals(slots){
  const t={k:0,p:0,f:0,c:0};
  (slots||[]).forEach(s=>{ const m=MEAL[s.m]; if(!m) return; const mm=mealMacros(m,s.x); t.k+=mm.k; t.p+=mm.p; t.f+=mm.f; t.c+=mm.c; });
  return t;
}
/* Meal selection: variety first. Meals are drawn at random from the whole pool (recently used ones less often),
   then only the portion sizes are tuned to hit the day's targets. */
const SCALES = {b:[0.75,1,1.25,1.5], m:[0.75,1,1.25,1.5,1.75], s:[1,1.5,2]};
function planCost(t,T){
  const dk=(t.k-T.kcal)/T.kcal, dp=(t.p-T.p)/T.p, df=(t.f-T.f)/T.f, dc=(t.c-T.c)/T.c;
  return 5*dk*dk + (dp<0?7*dp*dp:0.5*dp*dp) + 0.8*df*df + 0.8*dc*dc;
}
const dayCost = (sl,T)=> planCost(planTotals(sl),T) + sl.reduce((a,s)=>a+0.004*(s.x-1)*(s.x-1),0);
const slotCats = n => SLOTS[n].map(s=>s.cat);
function fitScales(sl,T,cats){
  const cur = sl.map(s=>({m:s.m, x:s.x||1}));
  for(let pass=0;pass<5;pass++){
    let changed=false;
    for(let i=0;i<cur.length;i++){
      const orig=cur[i]; let bx=orig.x, bc=dayCost(cur,T);
      for(const x of SCALES[cats[i]]){ cur[i]={m:orig.m,x}; const c=dayCost(cur,T); if(c<bc-1e-9){ bc=c; bx=x; } }
      cur[i]={m:orig.m,x:bx}; if(bx!==orig.x) changed=true;
    }
    if(!changed) break;
  }
  return cur;
}
/* 2 = on target, 1 = close, 0 = off */
function fitLevel(sl,T){
  const t=planTotals(sl); const dk=Math.abs(t.k-T.kcal)/T.kcal, pr=t.p/T.p, df=Math.abs(t.f-T.f)/T.f, dc=Math.abs(t.c-T.c)/T.c;
  if(dk<=0.04 && pr>=0.95 && df<=0.25 && dc<=0.2) return 2;
  if(dk<=0.08 && pr>=0.9 && df<=0.4 && dc<=0.35) return 1;
  return 0;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function remember(slots){
  const r=(state.recent||[]).filter(id=>!slots.some(s=>s.m===id));
  state.recent = slots.map(s=>s.m).concat(r).slice(0,30);
}
function buildDay(n,T){
  const slots=SLOTS[n], cats=slotCats(n), rec=state.recent||[];
  const wt = id => { const i=rec.indexOf(id); return i<0 ? 1 : i<n*2 ? 0.08 : i<n*4 ? 0.35 : 0.7; };
  const pickW = pool => { const tot=pool.reduce((a,m)=>a+wt(m.id),0); let r=Math.random()*tot; for(const m of pool){ r-=wt(m.id); if(r<=0) return m; } return pool[pool.length-1]; };
  let best=null, bestScore=-Infinity;
  for(let r=0;r<500;r++){
    const used=new Set();
    const pick=slots.map(s=>{ const m=pickW(MEALS.filter(x=>x.cat===s.cat && !used.has(x.id))); used.add(m.id); return {m:m.id,x:1}; });
    const tuned=fitScales(pick,T,cats); const lv=fitLevel(tuned,T);
    if(lv===2) return tuned;
    const sc = lv - dayCost(tuned,T);
    if(sc>bestScore){ bestScore=sc; best=tuned; }
  }
  return best;
}
/* Every meal in the slot's category, each with portions re-tuned so the day still adds up. */
function slotOptions(i){
  const T=targets(), n=state.plan.n, cats=slotCats(n), cur=state.plan.slots;
  const others=new Set(cur.filter((_,j)=>j!==i).map(s=>s.m));
  return MEALS.filter(m=>m.cat===cats[i] && !others.has(m.id)).map(m=>{
    const tuned = m.id===cur[i].m ? cur.map(s=>({m:s.m,x:s.x})) : fitScales(cur.map((s,j)=>j===i?{m:m.id,x:1}:{m:s.m,x:s.x}),T,cats);
    return {m, tuned, lv:fitLevel(tuned,T), t:planTotals(tuned), cost:dayCost(tuned,T), current:m.id===cur[i].m};
  }).sort((a,b)=> (b.current-a.current) || (b.lv-a.lv) || (a.cost-b.cost));
}
/* Next meal in a shuffled rotation through the whole category; every meal comes up before any repeats. */
function swapSlot(i){
  const T=targets(), n=state.plan.n, cats=slotCats(n), cur=state.plan.slots, key=n+':'+i;
  const others=new Set(cur.filter((_,j)=>j!==i).map(s=>s.m));
  ui.rot = ui.rot || {};
  let q=(ui.rot[key]||[]).filter(id=>id!==cur[i].m && !others.has(id));
  if(!q.length) q=shuffle(MEALS.filter(m=>m.cat===cats[i] && m.id!==cur[i].m && !others.has(m.id)).map(m=>m.id));
  let fallback=null, fb=Infinity;
  while(q.length){
    const id=q.shift();
    const tuned=fitScales(cur.map((s,j)=>j===i?{m:id,x:1}:{m:s.m,x:s.x}),T,cats);
    if(fitLevel(tuned,T)>=1){ ui.rot[key]=q; return tuned; }
    const c=dayCost(tuned,T); if(c<fb){ fb=c; fallback=tuned; }
  }
  ui.rot[key]=[];
  return fallback || cur;
}
function ensurePlan(){
  const n = +state.profile.meals===5 ? 5 : 4;
  if(!state.plan || !Array.isArray(state.plan.slots) || state.plan.slots.length!==n || state.plan.slots.some(s=>!MEAL[s.m])){
    state.plan = {n, slots: buildDay(n, targets())}; remember(state.plan.slots);
    Store.saveMain();
  }
}
function prog(){ return PROG[state.profile.program] || PROG.ul4; }
function week(){
  const start = state.profile.mesoStart || todayISO();
  const w = Math.floor((dnum(todayISO())-dnum(start))/7);
  return ((w%5)+5)%5 + 1;
}
function setsFor(base,t,wk){ if(wk.n===5) return Math.max(1,Math.ceil(base/2)); return base + (t==='i' ? wk.add : 0); }
function sessionsSorted(){ return Object.entries(state.sessions).map(([id,s])=>Object.assign({id},s)).sort((a,b)=>b.ts-a.ts); }
function lastEntry(exId){
  for(const s of sessionsSorted()){ const st = s.sets && s.sets[exId]; if(st && st.length) return {date:s.date, sets:st}; }
  return null;
}
function nextDayId(){
  const P = prog(); const last = sessionsSorted().find(s=>s.prog===P.id);
  if(!last) return P.d[0].id;
  const i = P.d.findIndex(d=>d.id===last.day);
  return P.d[(i+1)%P.d.length].id;
}
function suggest(exId,lo,hi,t,wk){
  const L = lastEntry(exId);
  if(!L) return {txt:`פעם ראשונה: משקל שמשאיר ${t==='c'?wk.rirC:wk.rirI} חזרות ברזרבה`, cls:''};
  const top = Math.max(...L.sets.map(s=>+s[0]||0));
  if(wk.n===5) return {txt:`דילואד: ${fmtW(top*0.9)} ק״ג`, cls:''};
  const inc = t==='c' ? 2.5 : 1;
  if(L.sets.every(s=>+s[1]>=hi)) return {txt:`העלה ל-${fmtW(top+inc)} ק״ג`, cls:'up'};
  if(L.sets.some(s=>+s[1]<lo)) return {txt:`הישאר על ${fmtW(top)} ק״ג`, cls:'hold'};
  return {txt:`${fmtW(top)} ק״ג, חזרה אחת יותר`, cls:''};
}
function volume(P,wk){
  const v={}; MUSCLES.forEach(([k])=>v[k]=0);
  P.d.forEach(d=>d.ex.forEach(([id,base])=>{ const x=EX[id]; const s=setsFor(base,x.t,wk); v[x.m]+=s; x.s.forEach(m=>v[m]+=s*0.5); }));
  return v;
}
function estMin(day,wk){ return Math.round(day.ex.reduce((s,[id,base,,,rest])=>s+setsFor(base,EX[id].t,wk)*(rest+45),0)/60/5)*5; }
function adjustment(t){
  if(!t || t.rate==null) return null;
  const p = state.profile; const gap = p.rate - t.rate;
  if(Math.abs(gap)<0.15) return {delta:0, gap};
  const delta = clamp(-Math.round(gap/100*t.cur*7700/7*0.5/50)*50, -250, 250);
  return {delta, gap};
}

      ${open?`<div class="det">${ingList(m,s.x)}<p class="small">${esc(m.st)}</p><div class="tags">${m.tags.map(g=>`<span class="tag">${TAGS[g]}</span>`).join('')}<span class="tag">${m.min} דק׳</span></div></div>`:''}
    </div>`; }).join('')}
  </div>

}
function optList(i){

}

    </div>`; }).join('')}</div>`;
}
function foodShop(){
  const days = ui.shopDays; const agg = {};
  state.plan.slots.forEach(s=>{ const m=MEAL[s.m]; m.ing.forEach(([id,q])=>{ const k = FOODS[id].buy || id; const qq = FOODS[id].buy ? q : q; agg[k]=(agg[k]||0)+qq*s.x*days; }); });
  const checked = ls.get('tochnit85.shop',{});
  const whites = state.plan.slots.some(s=>MEAL[s.m].ing.some(([id])=>id==='ewh'));
  const fmtQ = (id,q)=>{ const F=FOODS[id];
    if(F.u){ const n=Math.ceil(q); return F.pack ? `${n} יח׳ (${Math.ceil(n/F.pack)} ${F.pn})` : `${n} ${F.u}`; }
    const g = q>=1000 ? `${r1(q/1000)} ${F.ml?'ליטר':'ק״ג'}` : `${r5(q)} ${F.ml?'מ״ל':'ג׳'}`;

    return `<div class="aisle"><h3>${l}</h3><div class="shop">${items.map(([id,q])=>{ const key=id+':'+days; return `<label><input type="checkbox" id="sh-${id}" data-act="shopchk" data-k="${key}" ${checked[key]?'checked':''}><span class="n">${esc(FOODS[id].n)}${id==='egg'&&whites?' <span class="xs muted">(כולל ביצים להפרדת חלבונים)</span>':''}</span><span class="q num">${fmtQ(id,q)}</span></label>`; }).join('')}</div></div>`; }).join('')}
  <p class="xs muted" style="margin-top:12px">תבלינים, לימון, שום ועשבי תיבול לא נספרים. 5–10 קק״ל למנה.</p>`;
}

function weightChart(){
  const ws = sortedW(); const p = state.profile;
  const W=340,H=200,L=34,R=10,Tp=12,B=26;
  const s0 = dnum(p.startDate||todayISO());
  const firstD = ws.length ? Math.min(dnum(ws[0].d), s0) : s0;
  const startW = ws.length && dnum(ws[0].d)<=s0 ? +ws[0].w : +p.weight;
  const lastD = ws.length ? dnum(ws[ws.length-1].d) : dnum(todayISO());
  const x0 = firstD, x1 = Math.max(lastD+7, x0+42);
  const proj = t => Math.max(p.goal, startW*Math.pow(1-p.rate/100,(t-x0)/7));
  const ma = ws.map(e=>{ const t=dnum(e.d); const win=ws.filter(o=>{const u=dnum(o.d); return u>t-7&&u<=t;}); return {t, w: win.reduce((s,o)=>s+(+o.w),0)/win.length}; });
  const vals = ws.map(e=>+e.w).concat([proj(x0),proj(x1)]);
  let y0 = Math.floor(Math.min(...vals)-0.6), y1 = Math.ceil(Math.max(...vals)+0.6);
  if(y1-y0<4){ const mid=(y0+y1)/2; y0=Math.floor(mid-2); y1=Math.ceil(mid+2); }
  const step = (y1-y0)>10 ? 2 : 1;
  const X = t => L + (t-x0)/(x1-x0)*(W-L-R);
  const Y = w => Tp + (y1-w)/(y1-y0)*(H-Tp-B);
  let g='';
  for(let v=Math.ceil(y0/step)*step; v<=y1; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`; }
  const ticks = 4; for(let i=0;i<=ticks;i++){ const t=Math.round(x0+(x1-x0)*i/ticks); g+=`<text x="${X(t)}" y="${H-8}" text-anchor="${i===0?'start':i===ticks?'end':'middle'}" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${dshort(dstr(t))}</text>`; }
  let pp=''; for(let t=x0;t<=x1;t+=1) pp+=(t===x0?'M':'L')+X(t).toFixed(1)+' '+Y(proj(t)).toFixed(1)+' ';
  g+=`<path d="${pp}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  if(ws.length){
    g+=ws.map(e=>`<circle cx="${X(dnum(e.d)).toFixed(1)}" cy="${Y(+e.w).toFixed(1)}" r="2.6" fill="var(--muted)" opacity=".55"/>`).join('');
    if(ma.length>1){ const area = ma.map((o,i)=>(i?'L':'M')+X(o.t).toFixed(1)+' '+Y(o.w).toFixed(1)).join(' '); g+=`<path d="${area}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`; }
    const e = ma[ma.length-1]; g+=`<circle cx="${X(e.t)}" cy="${Y(e.w)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${Math.min(X(e.t)+8,W-R-30)}" y="${Y(e.w)-8}" font-size="12" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${r1(e.w)}</text>`;
  } else {
    g+=`<circle cx="${X(x0)}" cy="${Y(startW)}" r="4.5" fill="var(--accent)"/><text x="${X(x0)+8}" y="${Y(startW)-8}" font-size="12" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${startW}</text>`;
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף משקל">${g}</svg><div class="legend"><span><i style="--c:var(--accent)"></i>ממוצע נע 7 ימים</span><span><i style="--c:var(--muted);opacity:.6"></i>שקילה יומית</span><span><i class="d" style="--c:var(--muted)"></i>הקצב המתוכנן (${p.rate}% בשבוע)</span></div></div>`;
}
function renderTrack(){
  const tr = trend(); const T = targets(); const p = state.profile; const adj = adjustment(tr);
  const recentAdj = p.lastAdj && dnum(todayISO())-dnum(p.lastAdj) < 7;
  const ws = sortedW().reverse();
  const waistW = ws.filter(w=>w.waist);
  let smart;
  if(!tr || tr.rate==null){
    const need = tr ? Math.max(0, 14 - (tr.span+1)) : 14;
    smart = `<div class="note small"><b>התאמת קלוריות אוטומטית</b><br>אחרי שבועיים של שקילות (לפחות 3 בכל שבוע) האפליקציה משווה את קצב הירידה בפועל לקצב המתוכנן ומציעה תיקון. ${need?`עוד כ-${need} ימים.`:'צריך עוד שקילות בשבוע האחרון או בזה שלפניו.'}</div>`;
  } else {
    const est = Math.round((T.kcal + tr.rate/100*tr.cur*7700/7)/10)*10;
    const head = `קצב בפועל <b class="num">${r1(tr.rate).toFixed(1)}%</b> בשבוע מול יעד של <b class="num">${p.rate}%</b>.`;
    if(adj.delta===0) smart = `<div class="note good small">${head} בדיוק בטווח, לא משנים כלום.<br><span class="muted">הוצאה משוערת מהנתונים: כ-<span class="num">${est}</span> קק״ל (בהנחה שעמדת ביעד).</span></div>`;
    else smart = `<div class="note ${adj.delta<0?'warn':''} small stack" style="gap:8px"><div>${head} ${adj.delta<0?'יורד לאט מהתכנון.':'יורד מהר מהתכנון, וזה מסכן מסת שריר.'}</div><div>הצעה: <b class="num">${adj.delta>0?'+':''}${adj.delta}</b> קק״ל ביום (חצי מהפער, כדי לא להגיב לתנודות מים).</div><div class="muted">הוצאה משוערת מהנתונים: כ-<span class="num">${est}</span> קק״ל (בהנחה שעמדת ביעד).</div>
      ${recentAdj?`<div class="muted">התאמה אחרונה ב-${dshort(p.lastAdj)}. כדאי לחכות שבוע לנתונים חדשים.</div>`:`<button class="btn sm primary" data-act="apply-adj" data-d="${adj.delta}" style="width:fit-content">החל התאמה</button>`}</div>`;
  }
  return `
  <div class="sec-h"><h2>שקילה</h2></div>
  <div class="card stack">
    <div class="fgrid"><label class="f">תאריך<input type="date" id="wt-date" value="${todayISO()}" max="${todayISO()}"></label><label class="f">משקל (ק״ג)<input id="wt-w" inputmode="decimal" placeholder="${tr?r1(tr.last.w):p.weight}"></label></div>
    <label class="f">היקף מותניים בגובה הטבור (ס״מ, לא חובה)<input id="wt-waist" inputmode="decimal" placeholder="${waistW[0]?waistW[0].waist:'—'}"></label>
    <button class="btn primary" data-act="save-w">שמור שקילה</button>
  </div>

  <div class="sec-h"><h2>מגמה</h2></div>
  <div class="stats">
    <div class="stat"><span class="l">ממוצע 7 ימים</span><span class="v">${tr?r1(tr.cur):'—'}<small> ק״ג</small></span><span class="s">${tr?(tr.curN===1?'שקילה אחת':`${tr.curN} שקילות`):'אין עדיין שקילות'}</span></div>
    <div class="stat"><span class="l">שינוי שבועי</span><span class="v">${tr&&tr.change!=null?(tr.change>0?'+':'')+r1(tr.change):'—'}<small> ק״ג</small></span><span class="s">${tr&&tr.rate!=null?`${r1(tr.rate)}% בשבוע`:'צריך שבועיים'}</span></div>
    <div class="stat"><span class="l">עד ${p.goal} ק״ג</span><span class="v">${T.weeks}<small> שבועות</small></span><span class="s">בקצב של ${p.rate}%</span></div>
    <div class="stat"><span class="l">מותניים</span><span class="v">${waistW[0]?r1(+waistW[0].waist):'—'}<small> ס״מ</small></span><span class="s">${waistW.length>1?`${r1(waistW[0].waist-waistW[waistW.length-1].waist)>0?'+':''}${r1(waistW[0].waist-waistW[waistW.length-1].waist)} מההתחלה`:'מדד טוב לשומן'}</span></div>
  </div>
  <div style="margin-top:12px">${weightChart()}</div>
  <div style="margin-top:12px">${smart}</div>
  ${p.kcalAdj?`<p class="small muted" style="margin-top:8px">התאמה מצטברת: <span class="num">${p.kcalAdj>0?'+':''}${p.kcalAdj}</span> קק״ל. <button class="x" data-act="reset-adj">איפוס</button></p>`:''}

  <div class="sec-h"><h2>שקילות אחרונות</h2></div>
  ${ws.length?`<div class="wlist">${ws.slice(0,21).map(w=>{ const key='w:'+w.d; return `<div class="it"><span>${heDate(w.d,{weekday:'short',day:'numeric',month:'numeric'})}</span><span class="num">${r1(+w.w).toFixed(1)}${w.waist?` <span class="muted xs">· ${w.waist} ס״מ</span>`:''}</span><button class="x ${ui.confirm===key?'arm':''}" data-act="del-w" data-d="${w.d}">${ui.confirm===key?'למחוק?':'מחק'}</button></div>`; }).join('')}</div>`
  : `<p class="small muted">הקו המקווקו בגרף מראה את המסלול המתוכנן מ-${p.weight} ק״ג. כל שקילה תוסיף נקודה, והקו הכחול יציג את הממוצע השבועי.</p>`}
  `;
}

function renderSci(){
  const T = targets();
  return `
  <div class="sec-h"><h2>למה ככה</h2></div>
  <p class="small muted" style="margin-bottom:12px">כל מספר באפליקציה נשען על אחד מהממצאים כאן. המספרים שלך מתעדכנים אוטומטית עם המשקל.</p>
  <div class="sci">
    <article><h3>חלבון: ${T.p} ג׳ ביום</h3>
      <p class="take">1.9 ג׳ לכל ק״ג משקל גוף, מחולק ל-4–5 ארוחות של 35–50 ג׳.</p>
      <p>מטא-רגרסיה מ-2025 (Refalo, Trexler ו-Helms) על מתאמנים מנוסים בגירעון מצאה קשר כמעט ליניארי: ככל שהחלבון גבוה יותר, נשמרת יותר מסה רזה, עד בערך 1.9 ג׳ לק״ג משקל גוף (כ-2.5 ג׳ לק״ג מסה רזה). הקשר חזק יותר אצל גברים, בגירעונים של יותר מ-4 שבועות וככל שאחוז השומן יורד.</p>
      <p>ה-ISSN ממליץ על 20–40 ג׳ חלבון איכותי בכל ארוחה, בפריסה של בערך כל 3 שעות לאורך היום.</p></article>
    <article><h3>קצב ירידה: 0.5–0.7% בשבוע</h3>
      <p class="take">מהר יותר = יותר שריר הולך. לאט מספיק = אפשר אפילו להוסיף.</p>
      <p>בניסוי של Garthe ושות׳ (2011) ספורטאים שירדו 0.7% ממשקלם בשבוע עם 4 אימוני כוח הוסיפו מסה רזה וכוח, בעוד שמי שירד 1.4% בשבוע לא הוסיף מסה רזה. לכן ברירת המחדל כאן היא 0.6%, כ-600 גרם בשבוע בהתחלה. מ-100 ל-85 זה בערך חצי שנה.</p></article>
    <article><h3>כמה סטים לשריר</h3>
      <p class="take">10–20 סטים בשבוע לכל שריר, מחולקים לפחות לשני אימונים.</p>
      <p>Pelland ושות׳ (Sports Medicine, 2026) ניתחו 67 מחקרים: ההיפרטרופיה ממשיכה לעלות עם הנפח השבועי, עם תשואה פוחתת. כשמשווים נפח, לתדירות עצמה כמעט אין השפעה נוספת על גדילה. התדירות פשוט עוזרת לפזר את הסטים כך שכל אחד איכותי. בלשונית האימון יש מד נפח לכל שריר בכל רמה.</p></article>
    <article><h3>התקדמות ומאמץ</h3>
      <p class="take">טווח חזרות כפול: כשכל הסטים מגיעים לקצה העליון, מעלים משקל.</p>
      <p>RIR הוא מספר החזרות שנשארו לך ברזרבה. בגירעון כדאי להשאיר 1–2 בתרגילים המורכבים ולהתקרב לכשל בבידוד. כל שבוע חמישי הוא דילואד: חצי סטים ומשקל נמוך ב-10%, כדי שההתאוששות תדביק את הגירעון.</p></article>
    <article><h3>רה-קומפוזיציה אצל מתאמן מנוסה</h3>
      <p class="take">אפשרי, בעיקר כשיש עוד שומן לאבד. המשקל לבד לא יספר את כל הסיפור.</p>
      <p>סקירה של Barakat ושות׳ (2020) מראה שגם מתאמנים מנוסים בונים שריר ומורידים שומן במקביל, כשיש אימון התנגדות מתקדם וחלבון גבוה. הסקירה מציינת גם שינה כגורם. לכן כדאי לעקוב גם אחרי היקף מותניים והכוח באימונים, לא רק אחרי המשקל.</p></article>
    <article><h3>קריאטין</h3>
      <p class="take">5 ג׳ ביום, בכל שעה. מונוהידראט רגיל.</p>
      <p>לפי ה-ISSN, 3–5 ג׳ ביום שומרים על רוויה, ואצל אנשים מעל 90 ק״ג ייתכן שצריך 5–10 ג׳. בשבועות הראשונים נוסף בדרך כלל ק״ג או שניים של מים בשריר. זה לא שומן, ולכן ההתאמה האוטומטית מחכה לשבועיים של נתונים.</p></article>
    <article><h3>צעדים ושינה</h3>
      <p class="take">הגירעון מגיע מהצלחת. צעדים מוסיפים שריפה בלי לפגוע באימוני הרגליים.</p>
      <p>8–10 אלף צעדים ביום הם דרך זולה להגדיל את ההוצאה בלי עייפות שמצטברת כמו בריצות ארוכות. אם קצב הירידה נתקע ולא רוצים להוריד עוד אוכל, מוסיפים 2,000 צעדים לפני שמורידים קלוריות.</p></article>
    <article><h3>על היעד של 85 ק״ג</h3>
      <p class="take">בגובה 185, 85 ק״ג עם יותר שריר זה כבר די חטוב.</p>
      <p>אם תוסיף מסה בדרך, יכול להיות שתגיע למראה שאתה רוצה כבר ב-88–90. כדאי לבחון שוב את היעד כשהמותניים מפסיקים לרדת או כשהכוח מתחיל לרדת שבועיים ברצף.</p></article>
  </div>
  <div class="sec-h"><h2>מקורות</h2></div>
  <ul class="src">
    <li><a href="https://openrepository.aut.ac.nz/handle/10292/18694" target="_blank" rel="noopener">Refalo, Trexler, Helms (2025). Effect of Dietary Protein on Fat-Free Mass in Energy Restricted, Resistance-Trained Individuals. Strength and Conditioning Journal</a></li>
    <li><a href="https://pubmed.ncbi.nlm.nih.gov/28698222/" target="_blank" rel="noopener">Morton et al. (2018). Protein supplementation and resistance training gains. BJSM</a></li>
    <li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5477153" target="_blank" rel="noopener">ISSN Position Stand: Protein and exercise (2017)</a></li>
    <li><a href="https://jissn.biomedcentral.com/articles/10.1186/s12970-017-0189-4" target="_blank" rel="noopener">ISSN Position Stand: Nutrient timing (2017)</a></li>
    <li><a href="https://lida.sport-iat.de/ta/Record/4020442?lng=en" target="_blank" rel="noopener">Garthe et al. (2011). Effect of two different weight-loss rates on body composition and strength. IJSNEM</a></li>
    <li><a href="https://doi.org/10.1007/s40279-025-02344-w" target="_blank" rel="noopener">Pelland et al. (2026). The Resistance Training Dose Response. Sports Medicine 56(2)</a></li>
    <li><a href="https://doi.org/10.1519/SSC.0000000000000584" target="_blank" rel="noopener">Barakat et al. (2020). Body Recomposition: Can Trained Individuals Build Muscle and Lose Fat at the Same Time? SCJ</a></li>
    <li><a href="https://doi.org/10.1186/s12970-017-0173-z" target="_blank" rel="noopener">ISSN Position Stand: Creatine (2017)</a></li>
    <li><a href="https://www.ynet.co.il/health/article/5071890" target="_blank" rel="noopener">ynet: השוואת יוגורטים ומשקאות עתירי חלבון בישראל</a></li>
    <li><a href="https://world.openfoodfacts.org/product/7290004127329" target="_blank" rel="noopener">Open Food Facts: קוטג׳ 5% תנובה</a></li>
  </ul>
  <p class="xs muted" style="margin-top:16px">זה כלי אימון ותזונה, לא ייעוץ רפואי. אם יש לך מצב רפואי, תרופות קבועות או כאבים באימון, כדאי לעבור על זה עם רופא או דיאטן קליני.</p>
  `;
}

function renderSheet(){
  const p = state.profile; const T = targets();
  const opt = (arr,v)=>arr.map(([val,l])=>`<option value="${val}" ${+val===+v?'selected':''}>${l}</option>`).join('');
  $('#sheet').innerHTML = `<div class="in" dir="rtl">
    <div class="row" style="justify-content:space-between"><h2>פרופיל</h2><button class="btn sm" data-act="close-sheet">סגור</button></div>
    <div class="fgrid">
      <label class="f">גיל<input id="p-age" inputmode="numeric" value="${p.age}" data-p="age"></label>
      <label class="f">גובה (ס״מ)<input id="p-height" inputmode="numeric" value="${p.height}" data-p="height"></label>
      <label class="f">משקל התחלתי (ק״ג)<input id="p-weight" inputmode="decimal" value="${p.weight}" data-p="weight"></label>
      <label class="f">משקל יעד (ק״ג)<input id="p-goal" inputmode="decimal" value="${p.goal}" data-p="goal"></label>
    </div>
    <label class="f">רמת פעילות<select id="p-activity" data-p="activity">${opt(ACTIVITY,p.activity)}</select></label>
    <div class="fgrid">
      <label class="f">קצב ירידה בשבוע<select id="p-rate" data-p="rate">${opt([[0.4,'0.4% · שמרני'],[0.5,'0.5%'],[0.6,'0.6% · מומלץ'],[0.7,'0.7%'],[0.8,'0.8%'],[1,'1% · אגרסיבי']],p.rate)}</select></label>
      <label class="f">חלבון (ג׳ לק״ג)<select id="p-prot" data-p="prot">${opt([[1.6,'1.6'],[1.8,'1.8'],[1.9,'1.9 · מומלץ'],[2.0,'2.0'],[2.2,'2.2'],[2.4,'2.4']],p.prot)}</select></label>
    </div>
    <div class="note small">BMR <span class="num">${T.bmr}</span> · הוצאה <span class="num">${T.tdee}</span> · גירעון <span class="num">${T.def}</span> קק״ל ביום · יעד <b class="num">${T.kcal}</b><br><span class="muted">נוסחת Mifflin-St Jeor לגבר. השקילות שלך מחליפות את המשקל ההתחלתי בחישוב ברגע שיש אותן.</span></div>
    <p class="small muted">${Store.mode==='cloud'?'הנתונים נשמרים בחשבון שלך ומסונכרנים בין מכשירים.':window.Android?'הנתונים נשמרים בטלפון הזה. כדאי לשתף גיבוי פעם בכמה שבועות, למשל לדרייב או לצ׳אט עם עצמך.':'הנתונים נשמרים בדפדפן הזה. כשהעמוד פתוח מתוך החשבון שלך הם יסונכרנו אוטומטית.'}</p>
    ${window.Android?`<div class="stack"><button class="btn" data-act="backup">שתף קובץ גיבוי</button><textarea id="restore-txt" rows="3" placeholder="להדבקת טקסט גיבוי" aria-label="טקסט גיבוי לשחזור"></textarea><button class="btn" data-act="restore">${ui.confirm==='restore'?'לחץ שוב: הנתונים הנוכחיים יוחלפו':'שחזר מגיבוי'}</button></div>`:''}
    <button class="btn danger" data-act="reset-all">${ui.confirm==='reset'?'לחץ שוב למחיקת כל הנתונים':'איפוס כל הנתונים'}</button>
  </div>`;
}

/* ================= OVERLAYS ================= */
let toastT=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2400); }
let timerI=null;
function startTimer(sec,label){
  ui.timer={end:Date.now()+sec*1000,label}; const el=$('#timer'); el.hidden=false;
  clearInterval(timerI);
  const tick=()=>{ const left=Math.max(0,Math.round((ui.timer.end-Date.now())/1000));
    el.innerHTML=`<span>מנוחה</span><span class="num">${fmtRest(left)}</span><button data-act="timer-add">+30</button><button data-act="timer-stop">סיום</button>`;
    if(left<=0){ clearInterval(timerI); el.innerHTML=`<span>לסט הבא</span><button data-act="timer-stop">סגור</button>`; try{ if(window.Android && Android.vibrate) Android.vibrate(500); else if(navigator.vibrate) navigator.vibrate([180,80,180]); }catch(e){} setTimeout(()=>{ if(ui.timer && Date.now()>ui.timer.end+4000){ el.hidden=true; ui.timer=null; } },4500); } };
  tick(); timerI=setInterval(tick,500);
}

/* ================= EVENTS ================= */
let draftT=null;
const saveDraft = ()=>{ clearTimeout(draftT); draftT=setTimeout(()=>ls.set('tochnit85.draft',ui.draft),300); };
function setTab(t){ ui.tab=t; ls.set('tochnit85.tab',t); ui.confirm=null; render(); window.scrollTo({top:0}); }
function saveWeight(dateStr,w,waist){
  if(!(w>30 && w<300)){ toast('המשקל לא נראה תקין'); return false; }
  const i = state.weights.findIndex(x=>x.d===dateStr);
  const rec = {d:dateStr, w:r1(w)}; if(waist>40 && waist<200) rec.waist=r1(waist); else if(i>=0 && state.weights[i].waist) rec.waist=state.weights[i].waist;
  if(i>=0) state.weights[i]=rec; else state.weights.push(rec);
  Store.saveMain(); return true;
}
document.addEventListener('click',e=>{
  const tabB = e.target.closest('[data-tab]'); if(tabB){ setTab(tabB.dataset.tab); return; }
  const go = e.target.closest('[data-goto]'); if(go){ setTab(go.dataset.goto); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act; const p = state.profile;
  if(a!=='del-s' && a!=='del-w' && a!=='reset-all' && a!=='restore' && ui.confirm){ ui.confirm=null; }
  switch(a){
    case 'open-sheet': $('#sheet').hidden=false; renderSheet(); break;
    case 'close-sheet': $('#sheet').hidden=true; render(); break;
    case 'start-day': ui.trainDay=b.dataset.id; setTab('train'); break;
    case 'prog': p.program=b.dataset.id; ui.trainDay=null; Store.saveMain(); render(); break;
    case 'week': { const n=+b.dataset.n; p.mesoStart=dstr(dnum(todayISO())-(n-1)*7); Store.saveMain(); render(); break; }
    case 'day': ui.trainDay=b.dataset.id; render(); break;
    case 'done': {
      const {day,ex}=b.dataset, i=+b.dataset.i; ui.draft[day]=ui.draft[day]||{}; const arr=ui.draft[day][ex]=ui.draft[day][ex]||[];
      arr[i]=arr[i]||['','',false]; const on=!arr[i][2];
      if(on){ const wI=$('#w-'+day+'-'+ex+'-'+i), rI=$('#r-'+day+'-'+ex+'-'+i);
        if(!wI.value && wI.placeholder && !isNaN(parseFloat(wI.placeholder))){ wI.value=wI.placeholder; }
        if(!rI.value && rI.placeholder && /^\d+$/.test(rI.placeholder)){ rI.value=rI.placeholder; }
        arr[i][0]=wI.value; arr[i][1]=rI.value;
        if(!rI.value){ toast('הכנס מספר חזרות'); rI.focus(); return; }
        startTimer(+b.dataset.rest, EX[ex].n); }
      arr[i][2]=on; b.setAttribute('aria-pressed',String(on)); saveDraft(); break; }
    case 'timer-add': if(ui.timer){ ui.timer.end+=30000; } break;
    case 'timer-stop': clearInterval(timerI); ui.timer=null; $('#timer').hidden=true; break;
    case 'save-session': {
      const P=prog(); const day=P.d.find(d=>d.id===ui.trainDay); const dr=ui.draft[day.id]||{};
      const sets={}; let count=0;
      Object.entries(dr).forEach(([ex,arr])=>{ const s=(arr||[]).filter(x=>x && parseFloat(x[1])>0).map(x=>[parseFloat(x[0])||0, parseInt(x[1],10)]); if(s.length){ sets[ex]=s; count+=s.length; } });
      if(!count){ toast('מלא לפחות סט אחד עם חזרות'); break; }
      const ts=Date.now(); Store.saveSession('s_'+ts,{kind:'session',ts,date:todayISO(),prog:P.id,day:day.id,dayName:day.name,week:week(),sets});
      delete ui.draft[day.id]; ls.set('tochnit85.draft',ui.draft); ui.trainDay=null;
      toast(`נשמר: ${count} סטים`); render(); window.scrollTo({top:0}); break; }
    case 'del-s': { const key='s:'+b.dataset.id; if(ui.confirm===key){ Store.deleteSession(b.dataset.id); ui.confirm=null; } else ui.confirm=key; render(); break; }
    case 'quick-w': { const v=parseFloat($('#q-w').value); if(saveWeight(todayISO(),v)){ toast('השקילה נשמרה'); render(); } break; }
    case 'save-w': { const d=$('#wt-date').value||todayISO(); const v=parseFloat($('#wt-w').value); const wa=parseFloat($('#wt-waist').value); if(d>todayISO()){ toast('אי אפשר לשמור תאריך עתידי'); break; } if(saveWeight(d,v,wa)){ toast('השקילה נשמרה'); render(); } break; }
    case 'del-w': { const key='w:'+b.dataset.d; if(ui.confirm===key){ state.weights=state.weights.filter(w=>w.d!==b.dataset.d); Store.saveMain(); ui.confirm=null; } else ui.confirm=key; render(); break; }
    case 'apply-adj': p.kcalAdj=(+p.kcalAdj||0)+(+b.dataset.d); p.lastAdj=todayISO(); Store.saveMain(); toast('היעד עודכן. כדאי לבנות תפריט מחדש.'); render(); break;
    case 'reset-adj': p.kcalAdj=0; p.lastAdj=null; Store.saveMain(); render(); break;
    case 'habit': { const all=ls.get('tochnit85.habits',{}); const d=todayISO(); all[d]=all[d]||{}; all[d][b.dataset.k]=!all[d][b.dataset.k];
      const keep={}; Object.keys(all).sort().slice(-60).forEach(k=>keep[k]=all[k]); ls.set('tochnit85.habits',keep); b.setAttribute('aria-pressed',String(all[d][b.dataset.k])); break; }
    case 'nut': ui.nut=b.dataset.k; render(); break;
    case 'lib': ui.lib=b.dataset.k; ui.openMeal=null; render(); break;
    case 'rebuild': state.plan={n:state.plan.n, slots:buildDay(state.plan.n,targets())}; remember(state.plan.slots); ui.openSlot=null; ui.optSlot=null; Store.saveMain(); render(); toast('תפריט חדש מוכן'); break;
    case 'meals': { const n=+b.dataset.n; p.meals=n; state.plan={n,slots:buildDay(n,targets())}; remember(state.plan.slots); ui.optSlot=null; Store.saveMain(); render(); break; }
    case 'scale': { const i=+b.dataset.i; const s=state.plan.slots[i]; s.x=clamp(Math.round((s.x+ +b.dataset.d)*4)/4,0.5,2.5); Store.saveMain(); render(); break; }
    case 'swap': { const i=+b.dataset.i; state.plan.slots=swapSlot(i); remember([state.plan.slots[i]]); Store.saveMain(); render(); break; }
    case 'opts': { const i=+b.dataset.i; ui.optSlot = ui.optSlot===i?null:i; ui.openSlot=null; render(); break; }
    case 'pick-opt': { const i=+b.dataset.i; const o=slotOptions(i).find(x=>x.m.id===b.dataset.id); if(o){ state.plan.slots=o.tuned; remember([o.tuned[i]]); } ui.optSlot=null; Store.saveMain(); render(); break; }
    case 'toggle-slot': { const i=+b.dataset.i; ui.openSlot = ui.openSlot===i?null:i; ui.optSlot=null; render(); break; }
    case 'toggle-meal': ui.openMeal = ui.openMeal===b.dataset.id?null:b.dataset.id; render(); break;
    case 'put': { const i=+b.dataset.i; const n=state.plan.n; const trial=state.plan.slots.map((s,j)=>j===i?{m:b.dataset.id,x:1}:(s.m===b.dataset.id?null:{m:s.m,x:s.x}));
      if(trial.some(x=>!x)){ toast('הארוחה כבר בתפריט'); break; }
      state.plan.slots=fitScales(trial,targets(),slotCats(n)); remember([state.plan.slots[i]]); Store.saveMain(); toast('נוסף לתפריט, המנות כווננו ליעד'); render(); break; }
    case 'shopdays': ui.shopDays=+b.dataset.n; render(); break;
    case 'shopchk': { const all=ls.get('tochnit85.shop',{}); all[b.dataset.k]=b.checked; ls.set('tochnit85.shop',all); break; }
    case 'backup': try{ Android.share(JSON.stringify({app:'tochnit85',v:1,at:new Date().toISOString(),profile:state.profile,weights:state.weights,plan:state.plan,recent:state.recent,sessions:state.sessions})); }catch(err){ toast('השיתוף לא זמין'); } break;
    case 'restore': {
      const txt=($('#restore-txt')||{}).value||''; let o=null;
      try{ o=JSON.parse(txt.trim()); }catch(err){}
      if(!o || o.app!=='tochnit85' || !o.profile){ toast('זה לא נראה כמו גיבוי של תוכנית 85'); ui.confirm=null; break; }
      if(ui.confirm!=='restore'){ ui.confirm='restore'; const keep=txt; renderSheet(); $('#restore-txt').value=keep; break; }
      state.profile=Object.assign({},DEFAULT_PROFILE,o.profile); state.weights=Array.isArray(o.weights)?o.weights:[]; state.plan=o.plan||null; state.recent=Array.isArray(o.recent)?o.recent:[]; state.sessions=o.sessions||{};
      ui.confirm=null; ensurePlan(); Store.cacheLocal(); $('#sheet').hidden=true; render(); toast('הגיבוי שוחזר'); break; }
    case 'reset-all': if(ui.confirm==='reset'){ Object.assign(state.profile,DEFAULT_PROFILE,{mesoStart:todayISO(),startDate:todayISO()}); state.weights=[]; state.plan=null; Object.keys(state.sessions).forEach(id=>Store.deleteSession(id)); ui.draft={}; ls.set('tochnit85.draft',{}); ui.confirm=null; ensurePlan(); Store.saveMain(); toast('הנתונים אופסו'); $('#sheet').hidden=true; render(); } else { ui.confirm='reset'; renderSheet(); } break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.in==='w' || t.dataset.in==='r'){ const {day,ex}=t.dataset, i=+t.dataset.i; ui.draft[day]=ui.draft[day]||{}; const arr=ui.draft[day][ex]=ui.draft[day][ex]||[]; arr[i]=arr[i]||['','',false]; arr[i][t.dataset.in==='w'?0:1]=t.value; saveDraft(); }
});
document.addEventListener('change',e=>{
  const t=e.target; if(!t.dataset.p) return;
  const k=t.dataset.p; const v=parseFloat(t.value); if(isNaN(v)) return;
  const lim={age:[15,90],height:[140,220],weight:[40,250],goal:[40,250],activity:[1.2,2],rate:[0.2,1.5],prot:[1.2,3]}[k];
  state.profile[k]=clamp(v,lim[0],lim[1]);
  Store.saveMain(); render();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#sheet').hidden){ $('#sheet').hidden=true; render(); } });

window.__back = function(){
  if(!$('#sheet').hidden){ $('#sheet').hidden=true; render(); return true; }
  if(ui.tab!=='today'){ setTab('today'); return true; }
  return false;
};
render();
Store.connect();
})();
</script>
